{% extends "layout.html" %}

{% block title %}
    Quoted {{ name }}
{% endblock %}

{% block main %}
    <table>
        <tr>
            <th>Name</th>
            <th>Current Price</th>
            <th>Symbol</th>
        </tr>
        <tr>
            <td>{{ name }}</td>
            <td>{{ price | usd}}</td>
            <td>{{ symbol }}</td>
        </tr>
    </table>
{% endblock %}
